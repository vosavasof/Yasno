name: Публикация сайта
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_base:
        description: HTTPS API address for restoring or changing the connected server
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:assets
      - run: npm test
      - name: Build web interface
        env:
          YASNA_SHARED_API_BASE: ${{ inputs.api_base || vars.YASNA_SHARED_API_BASE }}
          PAGES_BASE_PATH: /Yasno/
        run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
