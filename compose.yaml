services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      MASTER_LOGIN: ${MASTER_LOGIN:-master}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Set MASTER_PASSWORD in .env}
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes:
      - yasna_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  yasna_data:
  caddy_data:
  caddy_config:
